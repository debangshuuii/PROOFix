# ==============================================================================
# PROOFix Turnkey Verification & Sticky PR Bot
# 
# 3-Line Quickstart for your own repository:
#   - uses: proofix/action@v1
#     with:
#       github-token: ${{ secrets.GITHUB_TOKEN }}
# ==============================================================================

name: PROOFix Turnkey Verification & PR Sticky Bot

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  verify:
    name: PROOFix Evidence Check & PR Sticky Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Turnkey PROOFix Verification
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verification-profile: 'full'
          fail-on-hydration-drift: 'true'
          fail-on-broken-routes: 'true'
          post-sticky-comment: 'true'
          fail-on-vitals-budget: 'true'
