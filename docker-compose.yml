services:
  proofix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proofix-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - proofix-data:/app/data
    restart: unless-stopped

volumes:
  proofix-data:
